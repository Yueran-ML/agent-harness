name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # A test that fails and then never ends would hold a runner for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows first. Linux stays for the tests of the container sandbox with a real Docker
        # engine, which can be run again here in Docker; macOS is not tested for now.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Images for the tests of the container sandbox and of the benchmark
        if: runner.os == 'Linux'
        run: |
          docker pull -q debian:bookworm-slim
          docker pull -q busybox
          docker pull -q python:3.12-slim

      - name: ffmpeg for the tests of the editing of video
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Test
        run: uv run python -m coverage run -m pytest --junitxml=junit.xml
        env:
          # On Linux the tests with a real Docker engine have to run. A runner without an
          # engine or without the images fails; it does not pass them over.
          COLUMBINA_REQUIRE_DOCKER: ${{ runner.os == 'Linux' && '1' || '' }}
          # So do the tests that make films with ffmpeg.
          COLUMBINA_REQUIRE_FFMPEG: ${{ runner.os == 'Linux' && '1' || '' }}

      - name: Coverage
        run: uv run python -m coverage report

      # The log of a run can be read only when one is signed in. Its summary and its
      # annotations can be seen by anyone, and the annotations read through the API.
      # The script needs nothing but Python, so it runs even where the install failed.
      - name: What failed
        if: failure()
        shell: bash
        run: |
          uv run --no-project python tests/support/failed.py junit.xml >> "$GITHUB_STEP_SUMMARY"
          uv run --no-project python tests/support/failed.py --annotations junit.xml

  # The engine of video (engine/), in Rust, against FFmpeg 8.1: see .github/scripts/ffmpeg.sh for
  # where it comes from. The studio is made for Windows first, and its engine is built and tested
  # only there for now. cargo runs in engine/, so that its rust-toolchain.toml holds. There
  # is no graphics card: the tests that draw with one pass themselves over without an adapter
  # (COLUMBINA_REQUIRE_GPU is not set), and those that need a desktop or a device of sound are
  # ignored, and not run.
  engine:
    name: Engine / Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: engine
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v7

      - name: FFmpeg 8.1
        run: bash ../.github/scripts/ffmpeg.sh

      # bindgen, for the bindings of libav, needs libclang. LLVM is on the images of Windows;
      # installed if it is not.
      - name: libclang
        run: |
          if [ ! -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then
            choco install llvm -y --no-progress
          fi
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # The toolchain of rust-toolchain.toml, with clippy and rustfmt. A rustup older than 1.28
      # installs it with `rustup show`.
      - name: Rust
        run: |
          rustup toolchain install || rustup show
          rustc --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The media of the tests are made in target/test-media by the ffmpeg first on PATH, and
      # every test that needs one has to run.
      # These tests also measure playback and exercise hardware decoders. Run them one at a
      # time so that other test engines and proxy encoders do not compete for the runner's
      # CPU and decoder sessions. Keep the same timing and frame-count assertions.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast -- --test-threads=1
        env:
          COLUMBINA_REQUIRE_FFMPEG: "1"

      - name: Documentation
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build for release
        run: cargo build --release --locked --package columbina-server --bin columbina-engine

      - uses: actions/upload-artifact@v7
        with:
          name: engine-Windows
          path: engine/target/release/columbina-engine.exe
          if-no-files-found: error
          retention-days: 7

  # The tests of Python that start the engine itself, with the release build of the job above
  # and the libraries of FFmpeg that it was built with.
  engine-python:
    name: Python with the engine / Windows
    needs: engine
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --locked

      # FFMPEG_DIR, whose bin the tests put at the end of PATH; and a full ffmpeg first on PATH,
      # with ffprobe beside it, to make the films.
      - name: FFmpeg 8.1
        run: bash .github/scripts/ffmpeg.sh

      - uses: actions/download-artifact@v8
        with:
          name: engine-Windows
          path: ${{ runner.temp }}/engine

      - name: The engine
        run: |
          program="$(cygpath -w "$RUNNER_TEMP/engine/columbina-engine.exe")"
          echo "COLUMBINA_ENGINE=$program" >> "$GITHUB_ENV"

      - name: Test
        run: uv run pytest --junitxml=junit.xml tests/video/test_engine.py tests/apps/test_video_command.py
        env:
          COLUMBINA_REQUIRE_ENGINE: "1"
          COLUMBINA_REQUIRE_FFMPEG: "1"

      - name: What failed
        if: failure()
        run: |
          uv run --no-project python tests/support/failed.py junit.xml >> "$GITHUB_STEP_SUMMARY"
          uv run --no-project python tests/support/failed.py --annotations junit.xml
