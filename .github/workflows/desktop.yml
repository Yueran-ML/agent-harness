name: Desktop

# A tag like desktop-v0.1.0 packages the desktop application for Windows on x64 and for macOS on
# Apple silicon, each on its own system and with a Python of its own, tries both packages, and
# publishes them as a release of that tag. Started by hand, it packages and tries them and keeps
# the packages with the run for a week, without a release. The package on PyPI is not touched.
#
# The package of Windows brings the engine of the studio, built here, with the LGPL shared build of
# FFmpeg 8.1 of BtbN that it is built with (see desktop/electron/engine-bundle.mjs). The package
# of macOS brings none for now: the engine of macOS is built against ffmpeg@8 of Homebrew, a GPL
# build, which is not to be shipped, and the view of the studio is not supported there yet.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The engine is built for release on Windows, which takes a while without a cache.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: macOS on Apple silicon
            os: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      # The version that the Python of the package was put together with on the machine of the author.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.7"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: The tag is the version of the application
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "desktop-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "the tag ${GITHUB_REF_NAME} is not the version ${version} of desktop/package.json"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The LGPL shared build that the engine is built with and that goes into the package
      # (FFMPEG_DIR), checked against the checksums of its release as for the engine of CI; and a
      # GPL build first on PATH, which only makes the film that the engine of the package is tried
      # with, and is not packaged.
      - name: FFmpeg 8.1
        if: runner.os == 'Windows'
        run: bash ../.github/scripts/ffmpeg.sh

      # bindgen, for the bindings of libav, needs libclang: LLVM is on the images of Windows, and
      # installed if it is not.
      - name: libclang
        if: runner.os == 'Windows'
        run: |
          if [ ! -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then
            choco install llvm -y --no-progress
          fi
          echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"

      # The toolchain of engine/rust-toolchain.toml. A rustup older than 1.28 installs it with
      # `rustup show`.
      - name: Rust
        if: runner.os == 'Windows'
        working-directory: engine
        run: |
          rustup toolchain install || rustup show
          rustc --version

      - uses: Swatinem/rust-cache@v2
        if: runner.os == 'Windows'
        with:
          workspaces: engine -> target

      - name: Build the engine
        if: runner.os == 'Windows'
        working-directory: engine
        run: cargo build --release --locked --package columbina-server --bin columbina-engine

      # The page, the Python with Columbina built from this commit, the icon of the system, the
      # application around them, and a zip of it. On Windows also the engine, the libraries of
      # FFmpeg and its ffmpeg (checked to be of the LGPL), and their notices, in resources/engine:
      # the engine of engine/target/release, and the FFmpeg of FFMPEG_DIR.
      - name: Package
        run: npm run package

      - name: Try the package
        run: npm run package:try

      # With nothing but Windows on PATH: the engine starts with the libraries beside it, and makes
      # the proxy of a film of 4K HEVC of 10 bits with the ffmpeg beside it.
      - name: Try the engine of the package
        if: runner.os == 'Windows'
        run: node scripts/try-engine.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os == 'Windows' && 'windows-x64' || 'macos-arm64' }}
          path: desktop/release/*.zip
          if-no-files-found: error
          retention-days: 7
          # A zip is compressed already.
          compression-level: 0

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          The desktop application of Columbina, with the service and a Python of its own in it.
          Nothing else needs to be installed.

          - **Windows 10 or 11 on x64**: `Columbina-…-windows-x64.zip`. Unpack it and open
            `Columbina.exe`. The application is not signed, so SmartScreen asks once: choose
            *More info*, then *Run anyway*.
          - **macOS 12 or later on Apple silicon**: `Columbina-…-macos-arm64.zip`. Unpack it, move
            `Columbina.app` into *Applications*, and let it open once in a terminal, since it is
            not signed with a certificate of Apple:
            `xattr -dr com.apple.quarantine /Applications/Columbina.app`

          The engine of the studio in the package of Windows (`resources/engine`) brings the
          libraries of FFmpeg, under the LGPL, and Rust crates under their own licenses: see
          `resources/engine/THIRD_PARTY_ENGINE.md` there. The package of macOS has no engine yet.

          The first start asks for the service of a model and its key. How to set up, and what
          the application can do: [README](https://github.com/Yueran-ML/agent-harness#the-desktop-application).

          The pictures, the opening film and the icon are AI-generated fan art and are not covered by
          the MIT license of the code. See [ASSETS.md](https://github.com/Yueran-ML/agent-harness/blob/main/desktop/ASSETS.md).
          EOF
          # A release of the tag may have been drafted on the site already, with the tag. It is given the
          # packages, and keeps what it says.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "Columbina desktop ${GITHUB_REF_NAME#desktop-v}" \
              --notes-file notes.md
          fi
