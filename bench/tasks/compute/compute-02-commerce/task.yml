id: compute-02-commerce
category: compute
prompt: |
  On one day, the outlet handles [hourly_rate] boxes per hour for [hours_per_day] hours. An extra rush order then adds [rush_order] more boxes. Then [damaged] boxes are damaged in handling and written off. How many boxes are left at the end?

  The numbers in brackets are not given here. Look each of them up with the tool lookup, by the name in the brackets. Work the answer out, and submit it, a whole number, with the tool submit_answer.
timeout_seconds: 300
max_steps: 25
