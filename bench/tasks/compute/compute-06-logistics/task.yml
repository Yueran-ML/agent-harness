id: compute-06-logistics
category: compute
prompt: |
  On one day, the warehouse handles [hourly_rate] packages per hour for [hours_per_day] hours. An extra rush order then adds [rush_order] more packages. Quality checks then reject [reject_percent] percent of the packages remaining at that point. The packages remaining at that point are then split evenly into [shipments] equal shipments, and only one shipment is kept. How many packages are left at the end?

  The numbers in brackets are not given here. Look each of them up with the tool lookup, by the name in the brackets. Work the answer out, and submit it, a whole number, with the tool submit_answer.
timeout_seconds: 300
max_steps: 25
