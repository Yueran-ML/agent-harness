id: compute-13-factory
category: compute
prompt: |
  Each day, the workshop handles [hourly_rate] parts per hour for [hours_per_day] hours. This daily routine repeats for [days] days in a row, and all subsequent operations apply to the combined total. Then [damaged] parts are damaged in handling and written off. How many parts are left in total at the end?

  The numbers in brackets are not given here. Look each of them up with the tool lookup, by the name in the brackets. Work the answer out, and submit it, a whole number, with the tool submit_answer.
timeout_seconds: 300
max_steps: 25
