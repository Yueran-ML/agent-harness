id: compute-16-factory
category: compute
prompt: |
  Each day, the plant handles [hourly_rate] parts per hour for [hours_per_day] hours. Each day, quality checks reject [reject_percent] percent of the parts remaining at that point. Each day, an extra rush order adds [rush_order] more parts. This daily routine repeats for [days] days in a row. How many parts are left in total at the end?

  The numbers in brackets are not given here. Look each of them up with the tool lookup, by the name in the brackets. Work the answer out, and submit it, a whole number, with the tool submit_answer.
timeout_seconds: 300
max_steps: 25
