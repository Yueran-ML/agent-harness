id: compute-17-commerce
category: compute
prompt: |
  Each day, the outlet handles [hourly_rate] boxes per hour for [hours_per_day] hours. Each day, [damaged] boxes are damaged in handling and written off. Each day, an extra rush order adds [rush_order] more boxes. This daily routine repeats for [days] days in a row. How many boxes are left in total at the end?

  The numbers in brackets are not given here. Look each of them up with the tool lookup, by the name in the brackets. Work the answer out, and submit it, a whole number, with the tool submit_answer.
timeout_seconds: 300
max_steps: 25
