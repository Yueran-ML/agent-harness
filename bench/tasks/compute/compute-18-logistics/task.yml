id: compute-18-logistics
category: compute
prompt: |
  Each day, the delivery hub handles [hourly_rate] packages per hour for [hours_per_day] hours. This daily routine repeats for [days] days in a row, and all subsequent operations apply to the combined total. Then [damaged] packages are damaged in handling and written off. The packages remaining at that point are then split evenly into [shipments] equal shipments, and only one shipment is kept. Each remaining package brings in [price] dollars when sold. How many dollars does this bring in total?

  The numbers in brackets are not given here. Look each of them up with the tool lookup, by the name in the brackets. Work the answer out, and submit it, a whole number, with the tool submit_answer.
timeout_seconds: 300
max_steps: 25
