id: compute-20-commerce
category: compute
prompt: |
  Each day, the store handles [hourly_rate] boxes per hour for [hours_per_day] hours. Each day, an extra rush order adds [rush_order] more boxes. Each day, the boxes remaining at that point are split evenly into [shipments] equal shipments, and only one shipment is kept. Each day, quality checks reject [reject_percent] percent of the boxes remaining at that point. This daily routine repeats for [days] days in a row, and all subsequent operations apply to the combined total. Each remaining box brings in [price] dollars when sold. How many dollars does this bring in total?

  The numbers in brackets are not given here. Look each of them up with the tool lookup, by the name in the brackets. Work the answer out, and submit it, a whole number, with the tool submit_answer.
timeout_seconds: 300
max_steps: 25
