id: compute-24-logistics
category: compute
prompt: |
  Each day, the delivery hub handles [hourly_rate] packages per hour for [hours_per_day] hours. Each day, quality checks reject [reject_percent] percent of the packages remaining at that point. Each day, [damaged] packages are damaged in handling and written off. Each day, an extra rush order adds [rush_order] more packages. This daily routine repeats for [days] days in a row, and all subsequent operations apply to the combined total. The packages remaining at that point are then split evenly into [shipments] equal shipments, and only one shipment is kept. Each remaining package brings in [price] dollars when sold. How many dollars does this bring in total?

  The numbers in brackets are not given here. Look each of them up with the tool lookup, by the name in the brackets. Work the answer out, and submit it, a whole number, with the tool submit_answer.
timeout_seconds: 300
max_steps: 25
