id: files-merge-csv
category: files
prompt: |
  Merge `sales/2024-01.csv`, `sales/2024-02.csv` and `sales/2024-03.csv` into a new
  file, `report/q1.csv`, with the single header line `date,region,amount`. Below it
  come the data rows of January, then February, then March, each month's rows in
  their original order, and every row gives its date, region and amount in the
  order of that header. End the file with a newline, and leave the files in
  `sales/` as they are.
timeout_seconds: 600
max_steps: 30
