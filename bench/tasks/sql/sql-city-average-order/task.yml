id: sql-city-average-order
category: sql
prompt: |
  Answer this question about the database of a shop:

  What is the average value of a delivered order in each city? The value of an order is the sum of quantity times price over its items. Return the city and the average rounded to 2 decimal places, by city name.

  The database is reached only with the tools list_tables, run_query and submit_sql. When you have a query whose rows answer the question, submit it with submit_sql: the rows of the last query that is submitted are the answer.
timeout_seconds: 300
max_steps: 25
