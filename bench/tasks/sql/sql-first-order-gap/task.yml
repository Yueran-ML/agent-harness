id: sql-first-order-gap
category: sql
prompt: |
  Answer this question about the database of a shop:

  For the customers who placed at least one order, how many days passed from the day they joined to their first order? Return the name and the number of days, the longest wait first, and by name where the days are equal.

  The database is reached only with the tools list_tables, run_query and submit_sql. When you have a query whose rows answer the question, submit it with submit_sql: the rows of the last query that is submitted are the answer.
timeout_seconds: 300
max_steps: 25
