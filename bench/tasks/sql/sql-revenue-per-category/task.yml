id: sql-revenue-per-category
category: sql
prompt: |
  Answer this question about the database of a shop:

  What revenue did each category bring in the delivered orders from April to June 2025, both months included? Return the category and the revenue rounded to 2 decimal places, the highest revenue first.

  The database is reached only with the tools list_tables, run_query and submit_sql. When you have a query whose rows answer the question, submit it with submit_sql: the rows of the last query that is submitted are the answer.
timeout_seconds: 300
max_steps: 25
