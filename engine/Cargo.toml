[workspace]
resolver = "2"
members = ["crates/model", "crates/store", "crates/server", "crates/media"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"
# Times in RFC 3339.
humantime = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
interprocess = { version = "2", features = ["tokio"] }
memchr = "2"
sha2 = "0.10"
# libav (FFmpeg's libraries), linked against an LGPL shared build: see crates/media.
ffmpeg-next = { version = "8.1", default-features = false, features = ["codec", "format", "software-scaling"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
