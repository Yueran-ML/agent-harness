[package]
name = "columbina-compose"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
columbina-lut = { path = "../lut" }
columbina-media = { path = "../media" }
columbina-model = { path = "../model" }
# The transforms of colour management, made operations of a stage (`ocio.rs`).
columbina-ocio = { path = "../ocio" }
cosmic-text.workspace = true
pollster.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[dev-dependencies]
# The shaders of the compositor read and validated as wgpu reads them, without a card: the
# version of wgpu's own naga, with its reader of WGSL.
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
