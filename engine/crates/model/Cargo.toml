[package]
name = "columbina-model"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# Project::sample, a small project for the tests of this crate and of the crates that use it.
sample = []

[dependencies]
serde.workspace = true
# Exact doubles, so that a transform or a gain is read back as it was written.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[dev-dependencies]
# The crate itself with Project::sample, for the tests in tests/.
columbina-model = { path = ".", features = ["sample"] }
proptest.workspace = true
