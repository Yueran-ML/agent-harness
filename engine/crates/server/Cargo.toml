[package]
name = "columbina-server"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[[bin]]
name = "columbina-engine"
path = "src/main.rs"

[dependencies]
columbina-media = { path = "../media" }
columbina-model = { path = "../model" }
columbina-store = { path = "../store" }
columbina-view = { path = "../view" }
cpal.workspace = true
interprocess.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# timeBeginPeriod, for timers fine enough to show each frame in time while playing; and a job
# of the system, which ends the ffmpeg that makes proxies with the engine.
windows = { workspace = true, features = [
    "Win32_Media",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# The id of the user, for the directory of its sockets.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# Project::sample, for the tests of the names of a transaction.
columbina-model = { path = "../model", features = ["sample"] }
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# A window of the test's own, for view.attach, and PrintWindow, to read what the view shows.
windows = { workspace = true, features = ["Win32_Storage_Xps"] }
