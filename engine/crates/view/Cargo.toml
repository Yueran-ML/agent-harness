[package]
name = "columbina-view"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
# View::lose_device and View::stall_for, for the tests: the card made to fail on purpose.
test-hooks = []

[dependencies]
columbina-media = { path = "../media" }
pollster.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[dev-dependencies]
# The crate itself with its hooks, for the tests in tests/.
columbina-view = { path = ".", features = ["test-hooks"] }

[target.'cfg(windows)'.dev-dependencies]
# PrintWindow, for the shots of examples/view_file.rs.
windows = { workspace = true, features = ["Win32_Storage_Xps"] }
