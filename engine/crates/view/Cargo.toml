[package]
name = "columbina-view"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
columbina-media = { path = "../media" }
pollster.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true
wgpu.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSThread"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSView", "NSWindow"] }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }

[target.'cfg(windows)'.dev-dependencies]
# PrintWindow, for the shots of examples/view_file.rs.
windows = { workspace = true, features = ["Win32_Storage_Xps"] }
