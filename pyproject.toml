[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "columbina"
version = "0.1.0"
description = "A plugin-based agent harness for Python."
# The description on PyPI: its links lead to the repository, and it has none of the pictures.
readme = "docs/pypi.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yueran Ma" }]
keywords = ["agent", "harness", "llm", "tool-calling", "coding-agent", "mcp", "asyncio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "keyring>=25",
  "prompt-toolkit>=3.0.50",
  "pydantic>=2.9",
  "pyyaml>=6.0.2",
  "rich>=13.9",
]

[project.scripts]
columbina = "columbina.apps.launcher:main"

[project.urls]
Homepage = "https://github.com/Yueran-ML/agent-harness"
Documentation = "https://github.com/Yueran-ML/agent-harness#readme"
Repository = "https://github.com/Yueran-ML/agent-harness"
Issues = "https://github.com/Yueran-ML/agent-harness/issues"
Changelog = "https://github.com/Yueran-ML/agent-harness/blob/main/CHANGELOG.md"

# The SDK of the Model Context Protocol brings some thirty packages with it. Whoever uses
# no MCP server does not need them: `pip install columbina[mcp]` installs them.
[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[dependency-groups]
dev = [
  "coverage>=7.6",
  "hypothesis>=6.115",
  "mcp>=2.3,<3",
  "pyright>=1.1.400",
  "pytest>=8.3",
  "pytest-asyncio>=1.0",
  "pytest-timeout>=2.3",
  "ruff>=0.9",
  "types-pyyaml>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/columbina"]

# The pictures of the README are no part of the software, and its license does not cover them.
# The desktop application is built apart, with packages of Node of its own.
[tool.hatch.build.targets.sdist]
exclude = ["/docs/assets", "/desktop"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tests/kernel/fixtures", "."]
# The tasks of the benchmark hold code as a model finds it, faults and all.
extend-exclude = ["docs", "bench/tasks"]

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # import order
  "N",     # naming
  "D",     # docstrings
  "UP",    # modern syntax
  "B",     # likely bugs
  "C4",    # comprehensions
  "SIM",   # simplifications
  "PT",    # pytest style
  "PTH",   # pathlib over os.path
  "PERF",  # performance pitfalls
  "ASYNC", # asyncio pitfalls
  "RUF",   # ruff-specific rules
]
ignore = [
  "D105", # magic methods need no docstring
  "D107", # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D",        # tests explain themselves by their names
  "ASYNC240", # a test may look at the file system from an async function
]
"tests/mutation/mutants.py" = ["E501"]  # the text of source lines, kept whole
"examples/**" = ["D"]
"src/columbina/fs/paths.py" = ["PTH"]  # a path is walked there name by name, as text

[tool.pyright]
include = ["src", "tests", "examples", "bench"]
exclude = ["bench/tasks"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["tests", "."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
xfail_strict = true
markers = ["live: talks to a real model service and needs its API key"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["columbina", "bench"]
# A few lines each, run by a test in a process of its own.
omit = ["*/columbina/__main__.py", "*/bench/__main__.py"]
# Counts code that only one platform can run on that platform. It is found from the root
# of the repository, so coverage is run as `python -m coverage`.
plugins = ["tests.support.coverage_platform"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
]
