# What every frontend builds on: the minimal program, the tools that change
# files and run commands, what keeps those tools in check, and what a model is
# told before it begins.
extends: minimal
patch:
  - insert:
      # What a call may do, and who is asked about it.
      # COLUMBINA_SANDBOX=docker runs the commands in a container.
      - id: sandbox
        plugin: columbina.sandbox
        config:
          provider: ${COLUMBINA_SANDBOX:-none}
      - id: approval
        plugin: columbina.approval
      - id: permissions
        plugin: columbina.permissions
        config:
          preset: workspace-write
          user_file: ${COLUMBINA_HOME}/permissions.yml
      # The tools beside the one that reads.
      - id: tool-write
        plugin: columbina.builtin_tools.write
      - id: tool-edit
        plugin: columbina.builtin_tools.edit
      - id: tool-glob
        plugin: columbina.builtin_tools.glob
      - id: tool-grep
        plugin: columbina.builtin_tools.grep
      - id: tool-shell
        plugin: columbina.builtin_tools.shell
      # Pages of the web and searches of it. A key of Tavily or Brave, kept with
      # `columbina search-key`, has the searches go there; without one DuckDuckGo is asked.
      - id: web
        plugin: columbina.web
        config:
          home: ${COLUMBINA_HOME}
      # The tools of GitHub, in the name of whoever signed in with `columbina login github`.
      - id: github
        plugin: columbina.github.tools
        config:
          home: ${COLUMBINA_HOME}
      # What the model is told when a conversation and a turn begin.
      - id: system-prompt
        plugin: columbina.system_prompt
      # How an agent goes about its work, whoever it is. A config names the
      # sections to leave out: work, changes, care, tools, program, words.
      - id: system-prompt-conduct
        plugin: columbina.system_prompt.conduct
      - id: context-instructions
        plugin: columbina.context.instructions
        config:
          user_file: ${COLUMBINA_HOME}/AGENTS.md
      # The language that the model reasons in, as `columbina reasoning-language` chose it.
      - id: context-reasoning-language
        plugin: columbina.context.reasoning_language
        config:
          file: ${COLUMBINA_HOME}/reasoning-language
      - id: context-runtime
        plugin: columbina.context.runtime
      # A request that fails for a passing reason is made again.
      - id: retry
        plugin: columbina.retry
      # What keeps a conversation within what its model takes: an estimate of
      # its size, a place for what is too large to be shown whole, a limit on
      # what one tool may give back, and a summary of the oldest part when the
      # conversation comes near the limit of the model.
      - id: token-meter
        plugin: columbina.token_meter
      - id: spill
        plugin: columbina.spill.local
        config:
          root: ${COLUMBINA_HOME}/spill
      - id: spill-policy
        plugin: columbina.spill.policy
      - id: compaction
        plugin: columbina.compaction.basic
      # What the requests cost, by the price lists of the services and the user's prices.yml.
      - id: prices
        plugin: columbina.prices
        config:
          home: ${COLUMBINA_HOME}
      # Whether a turn did what was asked, as the user says with /verdict.
      - id: verdicts
        plugin: columbina.verdicts
      # The files of the working directory as they stood before each turn, kept with
      # git in a repository of its own, for /rewind to go back to.
      - id: checkpoints
        plugin: columbina.checkpoints
        config:
          home: ${COLUMBINA_HOME}/checkpoints
      # The list of things to do that a model keeps for itself.
      - id: todo
        plugin: columbina.todo
      # What one turn may take at most. Without a config nothing is limited but
      # the steps of an agent whose spec says how many it has.
      - id: turn-budget
        plugin: columbina.guard.budget
      # A call that is made again with nothing changed since: the model is told
      # the third time, and the fifth time it does not run.
      - id: repeats
        plugin: columbina.guard.repeats
      # What a user adds to the program without changing it: skills that a
      # model loads when a task calls for one, commands that run at fixed
      # moments of a turn, tasks that are handed to an agent of their own, and
      # the tools of servers that speak the Model Context Protocol.
      - id: skills
        plugin: columbina.skills
        config:
          home: ${COLUMBINA_HOME}/skills
          user: ${COLUMBINA_AGENTS_HOME}/skills
      - id: hooks
        plugin: columbina.hooks
        config:
          user_file: ${COLUMBINA_HOME}/hooks.json
          trust_file: ${COLUMBINA_HOME}/trusted-hooks.json
      - id: subagents
        plugin: columbina.subagents
        config:
          home: ${COLUMBINA_HOME}/agents
      - id: subagent-spawn
        plugin: columbina.subagents.spawn
      - id: tool-subagent
        plugin: columbina.builtin_tools.subagent
      # A server is an entry of its own that loads columbina.mcp.server, and the
      # user adds it. What a server writes to its standard error goes to a file
      # in this directory.
      - id: mcp
        plugin: columbina.mcp
        config:
          log_dir: ${COLUMBINA_HOME}/logs
      # What a conversation is doing, written to a file for a desktop pet, the one of the desktop
      # application or a program of somebody else. COLUMBINA_PET_STATE names the file, and
      # without it nothing is written. See docs/pets.md.
      - id: pets
        plugin: columbina.pets
        config:
          file: ${COLUMBINA_PET_STATE:-}
