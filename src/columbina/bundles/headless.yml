# What `columbina run` loads: the base program and the frontend that runs one
# task. Nobody is there to be asked, so a call that needs a yes does not run
# unless a rule allows it.
extends: base
patch:
  - insert:
      - id: frontend
        plugin: columbina.apps.headless
        config:
          model:
            provider: deepseek
            model: ${COLUMBINA_MODEL:-deepseek-flash}
