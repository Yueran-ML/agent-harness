# The smallest program that can run a task: a session log, a model, the tool
# pipeline with one tool that only reads, and the loop.
- insert:
    - id: session
      plugin: columbina.session
      config:
        root: ${COLUMBINA_HOME}/sessions
    - id: llm
      plugin: columbina.llm
    - id: model
      plugin: columbina.llm.adapters.openai_chat
      config:
        provider: deepseek
        base_url: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
        api_key_env: DEEPSEEK_API_KEY
        # The keys that the user stored with `columbina setup`. The variable goes first.
        api_key_file: ${COLUMBINA_HOME}/credentials.json
        reasoning_style: deepseek
    - id: tools
      plugin: columbina.tools
      config:
        timeout_seconds: 120
    - id: fs
      plugin: columbina.fs
    - id: tool-read
      plugin: columbina.builtin_tools.read
    - id: agent
      plugin: columbina.agent
    - id: agent-loop
      plugin: columbina.agent_loop
