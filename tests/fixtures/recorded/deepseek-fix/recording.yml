# How this run was made: with the base program, and a rule that allows the one
# command which the notes for agents name.
#
#   columbina run "check.py fails. Find the mistake in calc.py and fix it, and make
#   sure that `python check.py` prints ok." --cwd COPY --session-id deepseek-fix
#   --allow "run(python check.py)"
#
# The model called the tool powershell, which only Windows has, so the run can
# happen again on Windows only.
platform: win32
profile:
  extends: base
  patch:
    # The list of things to do came to the base program after this run was made.
    # The model of the run was not offered the tool that writes it.
    - id: todo
      disabled: true
    # So did the conduct. The model of the run read the six sentences that the
    # program then began with, and they are in the log.
    - id: system-prompt-conduct
      disabled: true
    # The files were not kept before each turn either: no checkpoint is in the log.
    - id: checkpoints
      disabled: true
    # Nor were the tools of the web and of language servers offered.
    - id: web
      disabled: true
    - id: lsp
      disabled: true
    - id: permissions
      config:
        preset: workspace-write
        allow:
          - run(python check.py)
